name: Poetry Bot

on:
  schedule:
    - cron: "7 3 * * *"
    - cron: "23 5 * * *"
    - cron: "41 7 * * *"
    - cron: "13 9 * * *"
    - cron: "37 11 * * *"
    - cron: "17 13 * * *"
    - cron: "43 15 * * *"
    - cron: "11 17 * * *"
    - cron: "29 19 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poetry-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: dailybot

    steps:
      - name: Repository download
        uses: actions/checkout@v4

      - name: Go install
        uses: actions/setup-go@v5
        with:
          go-version-file: dailybot/go.mod
          cache-dependency-path: dailybot/go.sum

      - name: Poetry share
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: go run . -once